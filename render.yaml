# Render Blueprint: Render reads this when you connect the GitHub repo (New > Blueprint).
# The database lives on Neon; paste its connection string into DATABASE_URL when Render asks.
services:
  - type: web
    name: fittrack-api
    runtime: docker
    plan: free
    region: ohio                  # keep next to the Neon database (AWS us-east-2, Ohio)
    rootDir: backend              # only redeploy when backend/ changes
    dockerfilePath: ./Dockerfile  # resolved from rootDir (backend/)
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8081
