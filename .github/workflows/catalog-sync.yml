name: Catalog sync (weekly)

# Pulls exercises and equipment from wger into the production database.
# Needs the repo secret DATABASE_URL (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (2:17 am Toronto)
  workflow_dispatch: # "Run workflow" button on the Actions tab
    inputs:
      dry_run:
        description: "Fetch and validate only, write nothing"
        type: boolean
        default: false

concurrency:
  group: pipeline-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the secret is set
        run: test -n "$DATABASE_URL" || { echo "::error::Add the DATABASE_URL repo secret"; exit 1; }
      - name: Sync from wger
        run: python -m app.pipeline.catalog_sync ${{ inputs.dry_run && '--dry-run' || '' }}
